<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unity Web Player | UP</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body {
      background: url('taustapilt.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #231F20;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <script src="Build/Upt.loader.js" defer></script>
  <script defer>
    const canvas = document.getElementById("unity-canvas");

    // Mobiili DPI piirang, et vältida liigset mälu- ja CPU-kasutust
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const pixelRatio = isMobile ? Math.min(window.devicePixelRatio, 1.5) : window.devicePixelRatio;

    createUnityInstance(canvas, {
      arguments: [],
      dataUrl: "Build/Upt.data",
      frameworkUrl: "Build/Upt.framework.js",
      codeUrl: "Build/Upt.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "UP",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: pixelRatio
    });
  </script>
</body>
</html>
