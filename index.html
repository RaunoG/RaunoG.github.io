<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>Maailma loodusgeograafiliste kohanimede ja nende asukohta harjutav rakendus</title>

  <style>
    :root{
      --bg-color: #000;
      --panel-bg: rgba(0,0,0,0.6);
      --accent: #4fc3f7;
      --text: #fff;
    }
    html,body{
      height:100%;
      margin:0;
      -webkit-font-smoothing:antialiased;
      background: var(--bg-color) url('taustapilt.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color:var(--text);
      overflow:hidden;
    }

    /* Konteiner */
    #app {
      width:100%;
      height:100%;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* Unity container hoiab canvase keskel */
    #unity-container {
      width:100%;
      height:100%;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* Unity canvas – suurus määratakse JS-is vastavalt 16:9 ja 90% reeglile */
    canvas#unity-canvas {
      display:block;
      background:#231F20;
      outline:none;
      margin:auto;
      border-radius:12px;
    }

    /* Loader paneel */
    #loader {
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      min-width:260px;
      max-width:90%;
      padding:14px;
      border-radius:12px;
      background:var(--panel-bg);
      box-shadow:0 8px 24px rgba(0,0,0,0.5);
      text-align:center;
      z-index:40;
      backdrop-filter: blur(6px);
    }
    #logo { font-weight:700; margin-bottom:8px; font-size:16px; }
    #progress {
      height:10px;
      background:rgba(255,255,255,0.08);
      border-radius:8px;
      overflow:hidden;
      margin:10px 0 6px;
    }
    #progress > i {
      display:block;
      height:100%;
      width:0%;
      background:linear-gradient(90deg,var(--accent),#8be9ff);
      transition: width 200ms linear;
    }
    #progress-text { font-size:13px; opacity:0.9; margin-bottom:6px; }
    #mobile-hint { font-size:12px; opacity:0.8; }

    @media (max-width:720px) {
      #loader { padding:10px; border-radius:8px; min-width:200px; }
      #logo { font-size:14px; }
    }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div id="app">
    <div id="unity-container" role="application" aria-label="Unity WebGL content">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div id="loader" aria-hidden="false">
        <!-- LOADERI NIMI ON SIIN – muuda #logo sisu, et muuta pealkirja -->
        <div id="logo">Käivitamine</div>
        <div id="progress"><i id="progress-bar"></i></div>
        <div id="progress-text">0%</div>
        <div id="mobile-hint">Soovitus: kasuta WiFi-it. Võtab natuke aega</div>
      </div>
    </div>
  </div>

  <script src="Build/Upt.loader.js" defer></script>

  <script defer>
  (function(){
    const canvas = document.getElementById('unity-canvas');
    const loader = document.getElementById('loader');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');

    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|Opera Mini/i.test(navigator.userAgent);
    const DPR = isMobile ? Math.min(window.devicePixelRatio || 1, 1.5) : (window.devicePixelRatio || 1);

    // Canvas suuruse seadmine: alati 16:9 ja max 90% ekraanist
    function resizeCanvas() {
      const aspect = 16 / 9;
      let width = Math.floor(window.innerWidth * 0.9);
      let height = Math.floor(width / aspect);

      if (height > window.innerHeight * 0.9) {
        height = Math.floor(window.innerHeight * 0.9);
        width = Math.floor(height * aspect);
      }

      canvas.width = Math.floor(width * DPR);
      canvas.height = Math.floor(height * DPR);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';

      if (typeof Module !== 'undefined' && Module.canvas) {
        Module.canvas = canvas;
      }
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      if (typeof unityInstance !== 'undefined' && unityInstance.Module && unityInstance.Module.WebPlayer) {
        try { window.dispatchEvent(new Event('resize')); } catch(e) {}
      }
    }, {passive:true});

    resizeCanvas();

    const config = {
      dataUrl: "Build/Upt.data",
      frameworkUrl: "Build/Upt.framework.js",
      codeUrl: "Build/Upt.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "UP",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: DPR,
    };

    if (!('WebAssembly' in window)) {
      progressText.textContent = 'Sinu brauser ei toeta WebAssembly — palun uuenda brauserit.';
    }

    let unityInstance = null;
    function onProgress(unityProgress) {
      const pct = Math.round(unityProgress * 100);
      progressBar.style.width = pct + '%';
      progressText.textContent = pct + '%';
    }

    function startUnity() {
      if (typeof createUnityInstance !== 'function') {
        setTimeout(startUnity, 50);
        return;
      }
      createUnityInstance(canvas, config, onProgress).then((instance) => {
        unityInstance = instance;
        loader.classList.add('hidden');
        document.addEventListener('visibilitychange', () => {
          try {
            if (document.hidden) instance.SendMessage && instance.SendMessage('GameManager','OnPause');
            else instance.SendMessage && instance.SendMessage('GameManager','OnResume');
          } catch(e){}
        });
      }).catch((message) => {
        console.error(message);
        progressText.textContent = 'Laadimine nurjus — vaata konsooli.';
      });
    }

    if (isMobile) {
      const btn = document.createElement('button');
      btn.textContent = 'Käivita mäng';
      btn.style.cssText = 'position:absolute;left:50%;top:66%;transform:translateX(-50%);padding:10px 18px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;z-index:50;';
      document.body.appendChild(btn);
      btn.addEventListener('click', () => {
        btn.remove();
        startUnity();
      }, {once:true});
      progressText.textContent = 'Puuduta "Käivita mäng" et alustada';
    } else {
      startUnity();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(()=>{/*ignore*/});
    }
  })();
  </script>
</body>
</html>
